    This is a placeholder for base href that will be replaced by the value of

  <!-- DİKKAT: Bu değeri Flutter derleme sırasında dolduruyor ve VARSAYILANI
       "/" — site ise alt klasörde duruyor (github.io/OKEY101/). Düz
       `flutter build web` çalıştırırsan bütün dosyalar alan adının kökünden
       istenir, hiçbiri bulunamaz ve site MAVİ EKRANDA KALIR (1 Ağu 2026'da
       oldu; konsolda hata bile yok, uygulama çökmüyor — hiç yüklenmiyor).
       Yayınlamak için kök dizindeki `yayinla.ps1` kullanılır; o hem doğru
       değeri verir hem de yayınlamadan önce kontrol eder. -->
  <base href="/okey101/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="101 Dayama okey oyunu">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="101 Dayama">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>101 Dayama</title>
  <style>
    /* iOS: kaydırma/çekme hareketleri oyunu bozmasın; zemin oyun laciverti
       (çentik yanlarındaki güvenli alan şeritleri beyaz kalmasın) */
    html, body {
      background: #0E2A42;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
  </style>
  <link rel="manifest" href="manifest.json">

  <!--
    ÇENTİK (iPhone Dynamic Island) — ZORUNLU YAMA.

    Flutter web motoru açılışta head'deki BÜTÜN viewport etiketlerini SİLİP
    kendi etiketini koyuyor (main.dart.js içinde:
      querySelectorAll('meta[name="viewport"]') ... remove()
      p.name="viewport"
    ve içeriği "width=device-width, initial-scale=1.0, maximum-scale=1.0,
    user-scalable=no" — yani bizimkinin aynısı AMA viewport-fit=cover YOK).

    Sonuç: Safari sayfayı çentiğin içine sokmuyor, iki yandan 59'ar piksel
    kırpıyor ve güvenli alan payı olarak SIFIR bildiriyor. iPhone 16 yatayda
    852x393 yerine 734x393 tuval geliyordu; Flutter tarafında yapılan hiçbir
    düzeltme o şeridi geri alamıyor, çünkü tuval oraya kadar uzanmıyor.

    Aşağıdaki gözlemci, etiket ne zaman değişirse değişsin cover'ı geri
    ekliyor. indexOf kontrolü sonsuz döngüyü engelliyor (kendi yazdığımız
    değişiklik gözlemciyi tekrar tetikliyor ama ikinci turda iş yapmıyor).
  -->
  <script>
    (function () {
      var cover = 'viewport-fit=cover';
      function duzelt() {
        var m = document.querySelector('meta[name="viewport"]');
        if (m && m.content.indexOf(cover) === -1) {
          m.content = m.content + ', ' + cover;
        }
      }
      duzelt();
      new MutationObserver(duzelt).observe(document.head, {
        childList: true, subtree: true, attributes: true,
        attributeFilter: ['content', 'name']
      });
    })();
  </script>

  <!--
    GÜVENLİ ALAN PAYLARINI FLUTTER'A TAŞI.

    Yukarıdaki yama sayesinde sayfa artık çentiğin altına giriyor, ama
    Flutter web tarayıcının `env(safe-area-inset-*)` değerlerini
    MediaQuery.padding'e AKTARMIYOR — Dart tarafında hepsi sıfır görünüyor.
    Sonuç: tuval tam ekran ama Flutter çentiğin nerede olduğunu bilmiyor,
    kenardaki isim plakası çentiğin altında kalıyor.

    Burada payları görünmez bir ölçüm kutusuyla okuyup window'a yazıyoruz;
    Dart tarafı `lib/services/guvenli_alan.dart` ile bunları okuyor.
    Telefon döndürülünce değerler değişiyor, o yüzden resize/orientation
    olaylarında yeniden ölçülüyor.
  -->
  <script>
    (function () {
      function olc() {
        var d = document.createElement('div');
        d.style.cssText =
          'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
          'padding-left:env(safe-area-inset-left);' +
          'padding-right:env(safe-area-inset-right);' +
          'padding-top:env(safe-area-inset-top);' +
          'padding-bottom:env(safe-area-inset-bottom);';
        document.body.appendChild(d);
        var s = getComputedStyle(d);
        window.okeySolPay = parseFloat(s.paddingLeft) || 0;
        window.okeySagPay = parseFloat(s.paddingRight) || 0;
        window.okeyUstPay = parseFloat(s.paddingTop) || 0;
        window.okeyAltPay = parseFloat(s.paddingBottom) || 0;
        d.remove();
      }
      if (document.body) {
        olc();
      } else {
        document.addEventListener('DOMContentLoaded', olc);
      }
      addEventListener('resize', olc);
      addEventListener('orientationchange', olc);
    })();
  </script>
</head>

</body>
